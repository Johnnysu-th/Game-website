{% extends "layout.html" %}
{% extends "category,id = 0" %}
{% block body %}

  <h3 style="margin-top: 20px;">something new</h3>
<hr>
<div class="six-column">
    {% for game in results %}
       {% if game[6] == 0  %} 
        <div class="w3-card-4">
            <a href="{{ url_for('game', gameid=game[0]) }}">
                <img src="{{ game[5] }}" alt="{{ game[4] }}" class="gamecoverimg">
            </a>
        </div>
        {% endif %} 
    {% endfor %}
</div>



<!-- bottom image -->
<div class="bottomimage" style="margin-top: 200px;">
     <img src="{{ url_for('static', filename='image/bottom.png') }}" alt="bottomimage">
    </div>
    
{% endblock %}
