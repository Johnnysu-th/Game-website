{% extends "layout.html" %}
{% block body %}

<h3>something new</h3>
<hr>
<div class="three-column">
    {% for game in results %}
        {% if game[6] == 0  %} 
        <div class="w3-card-4">
            <a href="{{ url_for('game', gameid=game[0]) }}">
                <img src="{{ game[5] }}" alt="{{ game[4] }}" style="width:100%">
            </a>
        </div>
        {% endif %}
    {% endfor %}
</div>

<h3 style="margin-top: 50px;">Most popular</h3>
<hr>
<div class="three-column">
    {% for game in results %}
        {% if game[6] == 1 %}
        <div class="w3-card-4">
            <a href="{{ url_for('game', gameid=game[0]) }}">
                <img src="{{ game[5] }}" alt="{{ game[4] }}" style="width:100%">
            </a>
        </div>
        {% endif %}
    {% endfor %}
</div>

{% endblock %}
